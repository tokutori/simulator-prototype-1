[package]
name = "sim-cli"
version = "0.1.0"
default-run = "sim-cli"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fbw-control-core = { path = "../fbw-control-core" }
flight-dynamics-core = { path = "../flight-dynamics-core" }
nalgebra = { version = "=0.34.1", default-features = false, features = ["std"] }
plotters = "0.3.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
qx18-fbw-config = { path = "../qx18-fbw-config" }

[[bin]]
name = "sim-cli"
path = "src/main.rs"

[[bin]]
name = "plant-bridge"
path = "src/bin/plant-bridge.rs"

[lints]
workspace = true
