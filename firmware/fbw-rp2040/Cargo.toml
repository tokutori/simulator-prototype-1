[package]
name = "fbw-rp2040"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
embedded-hal = "1.0.0"
fbw-control-core = { path = "../../crates/fbw-control-core" }
fbw-input-core = { path = "../../crates/fbw-input-core" }
fbw-safety-core = { path = "../../crates/fbw-safety-core" }
fugit = "0.3.7"
libm = "0.2.15"
panic-halt = "1.0.0"
qx18-fbw-config = { path = "../../crates/qx18-fbw-config" }
rp2040-boot2 = "0.3.0"
rp2040-hal = { version = "0.12.0", features = ["rt", "critical-section-impl", "disable-intrinsics"] }

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"
