<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="鳥人間滑空機シミュレータの飛行後分析" />
    <title>Birdman Flight Analysis</title>
  </head>
  <body>
    <main class="analysis-shell">
      <header class="analysis-header">
        <div><p>SIMULATOR1 / POST-FLIGHT</p><h1>Flight analysis</h1></div>
        <div><strong id="analysis-status">LOADING</strong><span id="analysis-name"></span></div>
      </header>

      <p id="analysis-error" class="analysis-error" hidden></p>
      <section id="analysis-content" hidden>
        <dl class="summary-grid">
          <div><dt>Flight time</dt><dd id="summary-time">--</dd></div>
          <div><dt>Range</dt><dd id="summary-range">--</dd></div>
          <div><dt>Track</dt><dd id="summary-track">--</dd></div>
          <div><dt>Max altitude</dt><dd id="summary-altitude">--</dd></div>
          <div><dt>Final IAS</dt><dd id="summary-speed">--</dd></div>
          <div><dt>Max |roll|</dt><dd id="summary-roll">--</dd></div>
        </dl>

        <div class="analysis-grid">
          <article class="trajectory-article"><h2>Top-down trajectory</h2><div id="trajectory-chart" class="chart"></div></article>
          <article><h2>Altitude</h2><div id="altitude-chart" class="chart"></div></article>
          <article><h2>Airspeed</h2><div id="airspeed-chart" class="chart"></div></article>
          <article><h2>Pilot input</h2><div id="pilot-chart" class="chart"></div></article>
          <article><h2>Elevator command and response</h2><div id="elevator-chart" class="chart"></div></article>
          <article><h2>Rudder command and response</h2><div id="rudder-chart" class="chart"></div></article>
          <article><h2>Attitude and flight path</h2><div id="attitude-chart" class="chart"></div></article>
        </div>
      </section>
    </main>
    <script type="module" src="/src/analysis.ts"></script>
  </body>
</html>
